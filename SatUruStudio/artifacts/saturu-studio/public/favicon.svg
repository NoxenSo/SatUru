<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="pg" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Ring back -->
  <ellipse cx="16" cy="16" rx="14" ry="4.5" stroke="url(#rg)" stroke-width="1.4" fill="none" opacity="0.5"/>
  <!-- Planet glow -->
  <circle cx="16" cy="16" r="9" fill="#8b5cf6" opacity="0.18" filter="url(#glow)"/>
  <!-- Planet body -->
  <circle cx="16" cy="16" r="7.5" fill="url(#pg)"/>
  <!-- Ring front arc (over lower half of planet) -->
  <path d="M 2 16 Q 16 21 30 16" stroke="url(#rg)" stroke-width="1.8" fill="none"/>
  <!-- Highlight on planet -->
  <circle cx="13.5" cy="13.5" r="2" fill="white" opacity="0.15"/>
</svg>
